[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prune"
version = "0.1.0"
description = "Clean up stale local git branches, safely"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
prune = "prune.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prune"]

[[tool.uv.index]]
name = "SafetyPlatform"
url = "https://microsoft.pkgs.visualstudio.com/STaR/_packaging/SafetyPlatform/pypi/simple/"
default = true
username = "SafetyPlatform"
